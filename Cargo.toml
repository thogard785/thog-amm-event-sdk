[package]
name = "thogamm-events"
version = "0.7.1"
description = "Keep a ThogAMM pool current from a Monad WebSocket subscription, and quote it locally"
edition = "2021"
rust-version = "1.88"
resolver = "3"
publish = false
license = "MIT"
readme = "README.md"
repository = "https://github.com/thogard785/thog-amm-event-sdk"

[dependencies]
thogamm = { git = "https://github.com/thogard785/thog-amm-poll-sdk", tag = "v0.7.1" }
futures-util = { version = "0.3.31", features = ["sink"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["net", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
flate2 = "1.1"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync"] }

[profile.release]
overflow-checks = true
