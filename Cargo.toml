[package]
name = "event-driven-sdk"
version = "0.1.1"
description = "Deterministic ThogAMM quotes from Monad subscriptions"
edition = "2021"
rust-version = "1.88"
resolver = "3"
publish = false
license = "MIT"
readme = "README.md"
repository = "https://github.com/thogard785/thog-amm-event-sdk"

[dependencies]
thogamm-model = { git = "https://github.com/thogard785/thog-amm-poll-sdk", tag = "v0.1.1" }
alloy-primitives = "=1.7.3"
futures-util = { version = "0.3.31", features = ["sink"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["net", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
alloy-sol-types = "=1.7.3"
async-trait = "0.1.89"
flate2 = "1.1"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync"] }

[profile.release]
overflow-checks = true
